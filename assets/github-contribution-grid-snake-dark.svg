<svg width="100%" height="auto" viewBox="0 0 850 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snakeGridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="snakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="850" height="160" rx="10" fill="url(#snakeGridBg)" stroke="#1E293B" stroke-width="1" />
  
  <!-- Subtle decorative grid blocks to simulate contribution map -->
  <g transform="translate(30, 25)" opacity="0.6">
    <!-- Matrix of contribution blocks -->
    <g fill="#161B22">
      <!-- Week 1 - 10 demo dots -->
      <rect x="0" y="0" width="11" height="11" rx="2" fill="#0E4429" />
      <rect x="0" y="16" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="0" y="32" width="11" height="11" rx="2" fill="#006D32" />
      <rect x="0" y="48" width="11" height="11" rx="2" fill="#26A641" />
      <rect x="0" y="64" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="0" y="80" width="11" height="11" rx="2" fill="#0E4429" />
      <rect x="0" y="96" width="11" height="11" rx="2" fill="#161B22" />

      <rect x="16" y="0" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="16" y="16" width="11" height="11" rx="2" fill="#26A641" />
      <rect x="16" y="32" width="11" height="11" rx="2" fill="#39D353" />
      <rect x="16" y="48" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="16" y="64" width="11" height="11" rx="2" fill="#006D32" />
      <rect x="16" y="80" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="16" y="96" width="11" height="11" rx="2" fill="#0E4429" />

      <rect x="32" y="0" width="11" height="11" rx="2" fill="#006D32" />
      <rect x="32" y="16" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="32" y="32" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="32" y="48" width="11" height="11" rx="2" fill="#26A641" />
      <rect x="32" y="64" width="11" height="11" rx="2" fill="#39D353" />
      <rect x="32" y="80" width="11" height="11" rx="2" fill="#0E4429" />
      <rect x="32" y="96" width="11" height="11" rx="2" fill="#161B22" />

      <rect x="48" y="0" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="48" y="16" width="11" height="11" rx="2" fill="#006D32" />
      <rect x="48" y="32" width="11" height="11" rx="2" fill="#26A641" />
      <rect x="48" y="48" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="48" y="64" width="11" height="11" rx="2" fill="#161B22" />
      <rect x="48" y="80" width="11" height="11" rx="2" fill="#39D353" />
      <rect x="48" y="96" width="11" height="11" rx="2" fill="#006D32" />
    </g>
  </g>

  <!-- Cyan Snake eating dots across the grid -->
  <g transform="translate(180, 50)">
    <!-- Snake Body Segments -->
    <rect x="0" y="0" width="11" height="11" rx="2" fill="#8B5CF6" />
    <rect x="16" y="0" width="11" height="11" rx="2" fill="#8B5CF6" />
    <rect x="32" y="0" width="11" height="11" rx="2" fill="#818CF8" />
    <rect x="48" y="0" width="11" height="11" rx="2" fill="#38BDF8" />
    <rect x="64" y="0" width="11" height="11" rx="2" fill="#22D3EE" />
    <rect x="64" y="16" width="11" height="11" rx="2" fill="#00F5FF" filter="url(#snakeGlow)">
      <animate attributeName="fill" values="#00F5FF;#22D3EE;#00F5FF" dur="2s" repeatCount="indefinite" />
    </rect>
    <!-- Snake Eye -->
    <circle cx="72" cy="22" r="1.5" fill="#040711" />
  </g>

  <!-- Dynamic Text Overlay / Telemetry -->
  <g transform="translate(425, 80)" text-anchor="middle">
    <text x="0" y="0" fill="#00F5FF" font-family="'Fira Code', monospace" font-size="14" font-weight="600" letter-spacing="1">
      🐍 Automated Contribution Snake Action Configured
    </text>
    <text x="0" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      Runs every 12 hours via GitHub Actions &bull; Generates dynamic path: /output/github-contribution-grid-snake-dark.svg
    </text>
  </g>
</svg>
