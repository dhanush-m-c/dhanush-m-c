<svg width="100%" height="auto" viewBox="0 0 860 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="triBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="triBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="108" rx="12" fill="url(#triBg)" stroke="url(#triBorder)" stroke-width="1.2" />
  
  <!-- Icon Circle -->
  <g transform="translate(24, 25)">
    <rect width="60" height="60" rx="12" fill="#0B132B" stroke="#EC4899" stroke-width="1" />
    <!-- Brain / Memory Triad Icon -->
    <path d="M30 20L44 42H16L30 20Z" stroke="#EC4899" stroke-width="2" stroke-linejoin="round" />
    <circle cx="30" cy="20" r="3" fill="#F472B6" />
    <circle cx="44" cy="42" r="3" fill="#8B5CF6" />
    <circle cx="16" cy="42" r="3" fill="#00F5FF" />
  </g>

  <!-- Title & Status Badge -->
  <g transform="translate(100, 36)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">TriMemory AI</text>
    <text x="125" y="-1" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">— Unknown Operational-State Discovery &amp; Cognitive Memory</text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(100, 62)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Multi-tiered neural memory model mapping latent operational manifolds to uncover uncharted system failure states.
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(100, 88)">
    <text x="0" y="0" fill="#F472B6" font-family="'Fira Code', monospace" font-size="11">PYTHON &bull; COGNITIVE ARCHITECTURES &bull; TEMPORAL MEMORY &bull; VECTOR SPACES &bull; UNSUPERVISED ML</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(670, 22)">
    <rect width="166" height="24" rx="12" fill="#2E1065" stroke="#EC4899" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#F472B6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" fill="#F472B6" font-family="'Fira Code', monospace" font-size="10" font-weight="600">RESEARCH &amp; PROTOTYPE</text>
  </g>
</svg>
