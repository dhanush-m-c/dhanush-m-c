<svg width="100%" height="auto" viewBox="0 0 860 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="siqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="siqBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="108" rx="12" fill="url(#siqBg)" stroke="url(#siqBorder)" stroke-width="1.2" />
  
  <!-- Icon Circle -->
  <g transform="translate(24, 25)">
    <rect width="60" height="60" rx="12" fill="#0B132B" stroke="#00F5FF" stroke-width="1" />
    <!-- Stock/Chart SVG Icon -->
    <path d="M18 42L26 30L34 36L44 20" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M36 20H44V28" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="44" cy="20" r="3" fill="#22D3EE" />
  </g>

  <!-- Title & Status Badge -->
  <g transform="translate(100, 36)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">StockIQ</text>
    <text x="75" y="-1" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">— Supermarket Inventory Intelligence &amp; Replenishment Dashboard</text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(100, 62)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Real-time inventory risk scoring, spoilage prediction, threshold alerts &amp; data-driven replenishment automation.
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(100, 88)">
    <text x="0" y="0" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="11">PYTHON &bull; MACHINE LEARNING &bull; DATA ANALYTICS &bull; PANDAS &bull; INVENTORY OPTIMIZATION</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(710, 22)">
    <rect width="126" height="24" rx="12" fill="#022C22" stroke="#10B981" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#10B981" />
    <text x="24" y="16" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="600">PUBLIC REPO</text>
  </g>
