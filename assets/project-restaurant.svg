<svg width="100%" height="auto" viewBox="0 0 860 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="restBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="108" rx="12" fill="url(#restBg)" stroke="url(#restBorder)" stroke-width="1.2" />
  
  <!-- Icon Circle -->
  <g transform="translate(24, 25)">
    <rect width="60" height="60" rx="12" fill="#0B132B" stroke="#F59E0B" stroke-width="1" />
    <!-- Fork & Plate Icon -->
    <path d="M22 22V32C22 35 24 38 27 38V48" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <path d="M27 22V32" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <path d="M32 22V32C32 35 30 38 27 38" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <path d="M39 22V48" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title & Status Badge -->
  <g transform="translate(100, 36)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Responsive Culinary Platform</text>
    <text x="260" y="-1" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">— restaurant-website</text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(100, 62)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Modern, responsive culinary web application featuring dynamic menu filtering, mobile-first layouts and rich UI aesthetics.
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(100, 88)">
    <text x="0" y="0" fill="#34D399" font-family="'Fira Code', monospace" font-size="11">HTML5 &bull; CSS3 / SCSS &bull; JAVASCRIPT (ES6+) &bull; BOOTSTRAP &bull; RESPONSIVE UI</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(710, 22)">
    <rect width="126" height="24" rx="12" fill="#022C22" stroke="#10B981" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#10B981" />
    <text x="24" y="16" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="600">PUBLIC REPO</text>
  </g>
</svg>
