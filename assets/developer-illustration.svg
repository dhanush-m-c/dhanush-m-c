<svg width="100%" height="auto" viewBox="0 0 560 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="60%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00F5FF;#8B5CF6;#00F5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#8B5CF6;#00F5FF;#8B5CF6" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .c-cursor { animation: blinkCursor 0.9s infinite; }
    .c-orbit { transform-origin: 450px 150px; animation: orbitSpin 12s linear infinite; }
    .c-orbit-rev { transform-origin: 450px 150px; animation: orbitSpin 16s linear infinite reverse; }
    .c-orb { transform-origin: 450px 150px; animation: pulseOrb 3s ease-in-out infinite; }
    .t-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Terminal Window Shell -->
  <rect x="2" y="2" width="556" height="296" rx="14" fill="url(#termBg)" />
  <rect x="2" y="2" width="556" height="296" rx="14" fill="none" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="556" height="34" rx="14" fill="#0E1626" />
  <rect x="2" y="22" width="556" height="14" fill="#0E1626" />
  <line x1="2" y1="36" x2="558" y2="36" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#EF4444" opacity="0.9" />
  <circle cx="36" cy="18" r="5" fill="#F59E0B" opacity="0.9" />
  <circle cx="52" cy="18" r="5" fill="#10B981" opacity="0.9" />
  <text x="76" y="22" fill="#64748B" font-size="11" class="t-mono">engine.py — dhanush-workspace</text>
  
  <rect x="440" y="9" width="100" height="18" rx="9" fill="#0B132B" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.4" />
  <text x="490" y="21" fill="#00F5FF" font-size="9.5" font-weight="600" class="t-mono" text-anchor="middle">PYTHON 3.12</text>

  <!-- Left Side: IDE / Code Editor -->
  <g transform="translate(18, 54)">
    <!-- Line Numbers -->
    <text x="0" y="16" fill="#334155" font-size="11.5" class="t-mono">01</text>
    <text x="0" y="36" fill="#334155" font-size="11.5" class="t-mono">02</text>
    <text x="0" y="56" fill="#334155" font-size="11.5" class="t-mono">03</text>
    <text x="0" y="76" fill="#334155" font-size="11.5" class="t-mono">04</text>
    <text x="0" y="96" fill="#334155" font-size="11.5" class="t-mono">05</text>
    <text x="0" y="116" fill="#334155" font-size="11.5" class="t-mono">06</text>
    <text x="0" y="136" fill="#334155" font-size="11.5" class="t-mono">07</text>
    <text x="0" y="156" fill="#334155" font-size="11.5" class="t-mono">08</text>
    <text x="0" y="176" fill="#334155" font-size="11.5" class="t-mono">09</text>
    <text x="0" y="196" fill="#334155" font-size="11.5" class="t-mono">10</text>
    <text x="0" y="216" fill="#334155" font-size="11.5" class="t-mono">11</text>

    <!-- Code Content -->
    <!-- Line 1 -->
    <text x="28" y="16" font-size="12" class="t-mono">
      <tspan fill="#C084FC">from</tspan> <tspan fill="#E2E8F0">core</tspan> <tspan fill="#C084FC">import</tspan> <tspan fill="#38BDF8">Intelligence</tspan>, <tspan fill="#38BDF8">System</tspan>
    </text>

    <!-- Line 2 -->
    <text x="28" y="36" font-size="12" class="t-mono">
      <tspan fill="#C084FC">class</tspan> <tspan fill="#22D3EE" font-weight="600">Dhanush</tspan>(<tspan fill="#A5B4FC">SoftwareEngineer</tspan>):
    </text>

    <!-- Line 3 -->
    <text x="44" y="56" font-size="12" class="t-mono">
      <tspan fill="#94A3B8">degree</tspan> <tspan fill="#00F5FF">=</tspan> <tspan fill="#34D399">"B.Tech CSE (AI &amp; ML)"</tspan>
    </text>

    <!-- Line 4 -->
    <text x="44" y="76" font-size="12" class="t-mono">
      <tspan fill="#94A3B8">stack</tspan> <tspan fill="#00F5FF">=</tspan> [<tspan fill="#34D399">"Python"</tspan>, <tspan fill="#34D399">"FastAPI"</tspan>, <tspan fill="#34D399">"Docker"</tspan>]
    </text>

    <!-- Line 5 -->
    <text x="44" y="96" font-size="12" class="t-mono">
      <tspan fill="#94A3B8">interests</tspan> <tspan fill="#00F5FF">=</tspan> [<tspan fill="#34D399">"AI/ML"</tspan>, <tspan fill="#34D399">"Cloud"</tspan>, <tspan fill="#34D399">"DevOps"</tspan>]
    </text>

    <!-- Line 6 -->
    <text x="44" y="116" font-size="12" class="t-mono">
      <tspan fill="#C084FC">def</tspan> <tspan fill="#60A5FA">solve_problem</tspan>(<tspan fill="#F472B6">self</tspan>, <tspan fill="#94A3B8">challenge</tspan>):
    </text>

    <!-- Line 7 -->
    <text x="60" y="136" font-size="12" class="t-mono">
      <tspan fill="#94A3B8">model</tspan> <tspan fill="#00F5FF">=</tspan> <tspan fill="#38BDF8">Intelligence</tspan>.<tspan fill="#60A5FA">load</tspan>(<tspan fill="#94A3B8">challenge</tspan>)
    </text>

    <!-- Line 8 -->
    <text x="60" y="156" font-size="12" class="t-mono">
      <tspan fill="#94A3B8">pipeline</tspan> <tspan fill="#00F5FF">=</tspan> <tspan fill="#38BDF8">System</tspan>.<tspan fill="#60A5FA">optimize</tspan>(<tspan fill="#94A3B8">model</tspan>)
    </text>

    <!-- Line 9 -->
    <text x="60" y="176" font-size="12" class="t-mono">
      <tspan fill="#C084FC">return</tspan> <tspan fill="#94A3B8">pipeline</tspan>.<tspan fill="#60A5FA">deploy_production</tspan>()
    </text>

    <!-- Line 10 -->
    <text x="28" y="196" font-size="12" class="t-mono">
      <tspan fill="#64748B"># Continuously learning &amp; building...</tspan>
    </text>

    <!-- Line 11 -->
    <text x="28" y="216" font-size="12" class="t-mono">
      <tspan fill="#00F5FF">&gt;&gt;&gt;</tspan> <tspan fill="#E2E8F0">Dhanush().solve_problem(real_world)</tspan>
      <tspan class="c-cursor" fill="#00F5FF">▌</tspan>
    </text>
  </g>

  <!-- Right Side: Cybernetic AI Core Visualization -->
  <!-- Ambient Core Glow -->
  <circle cx="460" cy="160" r="60" fill="url(#nodeGlow)" />
  
  <!-- Outer Orbit 1 -->
  <g class="c-orbit" style="transform-origin: 460px 160px;">
    <ellipse cx="460" cy="160" rx="65" ry="32" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 4" />
    <circle cx="525" cy="160" r="3.5" fill="#8B5CF6" filter="url(#softGlow)" />
    <circle cx="395" cy="160" r="2.5" fill="#C084FC" />
  </g>

  <!-- Inner Orbit 2 -->
  <g class="c-orbit-rev" style="transform-origin: 460px 160px;">
    <ellipse cx="460" cy="160" rx="42" ry="54" fill="none" stroke="#00F5FF" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3 3" />
    <circle cx="460" cy="106" r="3.5" fill="#00F5FF" filter="url(#softGlow)" />
    <circle cx="460" cy="214" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Central Neural Core -->
  <g class="c-orb" style="transform-origin: 460px 160px;">
    <circle cx="460" cy="160" r="22" fill="url(#coreGrad)" filter="url(#softGlow)" />
    <circle cx="460" cy="160" r="14" fill="#040711" />
    <!-- Core Icon: Circuit / AI symbol -->
    <path d="M 454 160 L 466 160 M 460 154 L 460 166" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />
    <circle cx="460" cy="160" r="3" fill="#FFFFFF" />
  </g>

  <!-- Telemetry Data Below Orb -->
  <g transform="translate(460, 245)" text-anchor="middle">
    <text x="0" y="0" fill="#22D3EE" font-size="10" font-weight="600" class="t-mono" letter-spacing="1">SYSTEM OPTIMIZED</text>
    <text x="0" y="14" fill="#64748B" font-size="9" class="t-mono">LATENCY: 0.2ms &bull; GPU: ACTIVE</text>
  </g>
</svg>
